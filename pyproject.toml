[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mnistvision"
version = "0.1.0"
description = "A compact CNN for MNIST with calibration, Grad-CAM and robustness checks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Manish27-tech" }]
dependencies = [
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<3.0",
    "matplotlib>=3.8,<4.0",
    "scikit-learn>=1.5,<2.0",
    "torch>=2.4,<3.0",
    "torchvision>=0.19,<1.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6,<1.0", "pytest>=8.0,<9.0"]
app = ["streamlit>=1.40,<2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
